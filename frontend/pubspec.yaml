name: mindsync_ai
description: "MindSync AI - An AI-Driven Mental Wellness Companion for IT Professionals"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing & Navigation
  go_router: ^14.2.0

  # Networking & APIs
  dio: ^5.4.3
  flutter_dotenv: ^5.1.0

  # Databases & Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.0

  # Firebase Cloud Services
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.1
  firebase_messaging: ^15.0.4

  # Data Visualization
  fl_chart: ^0.68.0

  # Design & UI Components
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1

  # Core Hardware Sensors & Utilities
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  logger: ^2.4.0
  intl: ^0.19.0
  equatable: ^2.0.5

  # Device Hardware Sensors (Optional / Platform Specific)
  sensors_plus: ^5.0.1
  pedometer: ^4.0.1
  open_filex: ^4.7.0
  path_provider: ^2.1.3
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Testing Mocks
  mocktail: ^1.0.4

  # Code Generation
  build_runner: ^2.4.11
  freezed: ^2.5.7
  freezed_annotation: ^2.4.4
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true

  # Asset definitions for assets folder
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env
